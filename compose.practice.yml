# 在原部署上构建包含 /practice 的前端，其他服务沿用 docker-compose.yml。
# 首次启用或源码更新后需要 --build；后续启动仍需带上本覆盖文件。
services:
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-}"
        NEXT_PUBLIC_WS_URL: "${NEXT_PUBLIC_WS_URL:-}"
        NEXT_PUBLIC_WS_PUBLIC_HOST: "${NEXT_PUBLIC_WS_PUBLIC_HOST:-}"
        NEXT_PUBLIC_WS_PUBLIC_PORT: "${NEXT_PUBLIC_WS_PUBLIC_PORT:-}"
    image: qihuo-frontend-practice:local
    pull_policy: never
    restart: unless-stopped
